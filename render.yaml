# Déploiement du backend FootAnalyse sur Render (offre gratuite).
# Aucune clé n'est écrite ici : Render les demande à la création (sync: false)
# et les garde chiffrées. Sans moyen de paiement enregistré, Render suspend le
# service en cas de dépassement au lieu de facturer.
services:
  - type: web
    name: foot-analyses-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements-server.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Source principale des statistiques (clé gratuite football-data.org).
      - key: FOOTBALL_DATA_KEY
        sync: false
      # Facultatif : IA gratuite Groq (compréhension + mise en forme).
      - key: GROQ_API_KEY
        sync: false
      # Chatbot gratuit basé sur des sources ; l'IA payante reste désactivée.
      - key: CHAT_ENGINE
        value: free
      - key: ENABLE_PUBLIC_AI
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://pronoben.github.io
      # Render place Cloudflare et son proxy devant le serveur.
      - key: TRUST_PROXY
        value: "true"
      # Limites par visiteur et plafonds du site (protègent les quotas gratuits).
      - key: CHAT_LIMIT_PER_5MIN
        value: "8"
      - key: CHAT_LIMIT_PER_DAY
        value: "30"
      - key: FREE_CHAT_PER_HOUR
        value: "300"
      - key: FREE_CHAT_PER_DAY
        value: "1500"
